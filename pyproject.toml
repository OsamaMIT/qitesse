[build-system]
requires = ["maturin>=1.2"]
build-backend = "maturin"

[project]
name = "qitesse"
version = "0.2.0"
description = "High-throughput CPU backend for repeated evaluation of parameterized quantum circuits"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Osama Elmahdy", email = "you@example.com"}]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
docs = [
    "Sphinx>=8.2",
]
